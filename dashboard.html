<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLTA. dasbor lawas</title>
<style>
  body { background: #0a0a0b; color: #f2efe9; font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px; text-align: center; }
  main { max-width: 560px; margin: 0 auto; }
  canvas { display: block; margin: 24px auto; }
  a { color: #5b79ff; }
  p { color: #a7a7b0; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>VOLTA. dasbor lawas</h1>
  <canvas id="canvas" width="120" height="48"></canvas>
  <p>Halaman ini hanya penanda rute <code>/</code> agar server tetap punya
  dasbor bawaan. Klien utama adalah webapp (lihat <code>tasks/plan-webapp.md</code>).</p>
</main>
<script>
// Motif Bit Pair: kotak solid (1/HIGH) + ring (0/LOW).
(function () {
  var c = document.getElementById("canvas");
  if (!c) return;
  var x = c.getContext("2d");
  x.fillStyle = "#f2efe9";
  x.fillRect(8, 8, 32, 32);
  x.strokeStyle = "#f2efe9";
  x.lineWidth = 4;
  x.strokeRect(80, 8, 32, 32);
})();
</script>
</body>
</html>
