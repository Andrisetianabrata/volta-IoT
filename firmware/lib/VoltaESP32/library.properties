sentence=Non-blocking OOP toolkit for ESP32: scheduler, filters, IO, and MQTT client for VOLTA. server.
paragraph=Cooperative millis-based scheduler, debounced buttons, LED/PWM fade, relay guard times, ADC1-safe analog reads, moving average/median/exponential filters, CSV builder, leveled logger, and a non-blocking MQTT device client speaking the VOLTA. topic protocol. No delay() anywhere. Defaults target ESP32-WROOM-32.
